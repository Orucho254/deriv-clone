name: Independent preview build
on:
  push:
    branches: [main, build-readiness]
    paths:
      - 'application/**'
      - '.github/workflows/preview-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'application/**'
      - '.github/workflows/preview-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: application
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: application/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
      - name: Check static output
        run: node scripts/check-build.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: independent-preview
          path: application/dist
          if-no-files-found: error
          retention-days: 7
