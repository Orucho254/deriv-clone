name: Application CI

on:
  pull_request:
    paths:
      - "application/**"
      - ".github/workflows/application-ci.yml"
  push:
    branches:
      - main
      - "codex/**"
    paths:
      - "application/**"
      - ".github/workflows/application-ci.yml"

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: application
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: application/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: TypeScript and production build
        run: npm run build
      - name: Unit tests
        run: npm test
      - name: Lint
        run: npm run lint
